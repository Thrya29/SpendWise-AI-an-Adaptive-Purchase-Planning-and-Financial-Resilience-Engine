name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests on PostgreSQL)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise
          POSTGRES_DB: spendwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spendwise" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - name: Tests (SQLite, with coverage gate)
        run: pytest --cov --cov-report=xml
      - name: Create isolated database for the migration round-trip test
        run: PGPASSWORD=spendwise psql -h localhost -U spendwise -d spendwise_test -c "CREATE DATABASE spendwise_migrations"
      - name: Tests (PostgreSQL)
        env:
          SPENDWISE_DATABASE_URL: postgresql+asyncpg://spendwise:spendwise@localhost:5432/spendwise_test
          SPENDWISE_MIGRATION_TEST_URL: postgresql+asyncpg://spendwise:spendwise@localhost:5432/spendwise_migrations
        run: pytest
      - name: API contract is in sync with the frontend
        run: python scripts/export_openapi.py /tmp/openapi.json && diff -u ../frontend/openapi.json /tmp/openapi.json
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Unit tests under another locale (catches machine-dependent formatting)
        run: npm test
        env:
          LANG: de_DE.UTF-8
          LC_ALL: de_DE.UTF-8
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t spendwise-api ./backend
      - run: docker build -t spendwise-web ./frontend

# SpendWise AI: full stack.
#   python scripts/generate_env.py   # once, creates .env with random secrets
#   docker compose up --build -d
#   open http://localhost:3000
#
# Only the web app is published to the host. The API, database and Redis are
# reachable solely on the internal network; the web server proxies /api to the API.

name: spendwise

x-api-env: &api-env
  SPENDWISE_ENVIRONMENT: production
  SPENDWISE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?run scripts/generate_env.py}:${POSTGRES_PASSWORD:?run scripts/generate_env.py}@db:5432/${POSTGRES_DB:-spendwise}
  SPENDWISE_REDIS_URL: redis://redis:6379/0
  SPENDWISE_JWT_SECRET: ${SPENDWISE_JWT_SECRET:?run scripts/generate_env.py}
  SPENDWISE_ENCRYPTION_KEY: ${SPENDWISE_ENCRYPTION_KEY:?run scripts/generate_env.py}
  SPENDWISE_COOKIE_SECURE: ${SPENDWISE_COOKIE_SECURE:-true}
  # The API is reachable only from the web container, which forwards the client IP.
  FORWARDED_ALLOW_IPS: "*"
  SPENDWISE_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/generate_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/generate_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  worker:
    # Same image as the API: refreshes exchange rates and re-checks tracked prices.
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      <<: *api-env
      SPENDWISE_RUN_MIGRATIONS: "false"  # the api service owns migrations
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]

volumes:
  pgdata:

networks:
  backend:
  frontend:
